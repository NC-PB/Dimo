[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/NC-PB/dimo"
publish = false

[workspace.dependencies]
# Internal crates
dimo-core = { path = "crates/dimo-core" }
dimo-notation = { path = "crates/dimo-notation" }
dimo-tolerance = { path = "crates/dimo-tolerance" }
dimo-pdf = { path = "crates/dimo-pdf" }
dimo-vision = { path = "crates/dimo-vision" }
dimo-detect = { path = "crates/dimo-detect" }
dimo-io = { path = "crates/dimo-io" }
dimo-report = { path = "crates/dimo-report" }

# External crates, exact versions (AGENTS.md rule 10)
# Dates for PDF annotations (T1.2). Already in the tree through pdfium-render, whose
# annotation API takes chrono types; the clock is never read.
chrono = { version = "=0.4.45", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
insta = { version = "=1.48.0" }
# PDFium bindings. API level must match the PDFium release pinned in scripts/pdfium.toml.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
# Tile encoding (T0.7), pure Rust PNG with fdeflate.
png = { version = "=0.18.1" }
# Flate compression of the stress PDF (T0.9). Already in the tree through png.
miniz_oxide = { version = "=0.8.9" }
# Property tests (T1.1). No fork or timeout support, keeps the dependency tree small.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9" }
tempfile = { version = "=3.27.0" }
# Characteristic list export (T1.4). csv: RFC 4180 writer. rust_xlsxwriter: new workbooks only.
csv = { version = "=1.4.0" }
rust_xlsxwriter = { version = "=0.99.0" }
tauri = { version = "=2.11.6", features = [] }
# Native file dialog, called from Rust only (T0.8, NFR-SEC-01). GTK 3 backend on Linux like Tauri.
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
tauri-build = { version = "=2.6.3", features = [] }
boon = "=0.6.1"
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
# Tolerance table files (T2.2, D-43). Already in the tree through Tauri; parser only, no writer.
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
# Callout grammar (T2.1, spec 06). Already in the tree through the toml crates of Tauri.
winnow = { version = "=1.0.4", default-features = false, features = ["std", "ascii"] }
# Typed IPC (NFR-MNT-03). Only release candidates exist; tauri-specta pins specta exactly.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = { version = "=0.1.44" }
# Project container (T1.3). Reads stored and deflated entries, writes stored only (deterministic).
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Stable IDs of the domain model (FR-BAL-09). No generator features: IDs come from a provider.
uuid = { version = "=1.26.1", default-features = false, features = ["std", "serde"] }

[workspace.lints.rust]
# Exceptions only in an isolated FFI module with a safety comment (rust.md).
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
# rust.md: tracing, never println! in library code. Binaries allow it locally.
print_stdout = "warn"
print_stderr = "warn"
