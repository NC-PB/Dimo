[package]
name = "typst-report-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Standalone, not a member of the Dimo workspace (spikes never are).
[workspace]

[features]
default = ["render"]
# Without this feature the binary is an empty baseline for the size and build time numbers.
render = ["dep:typst", "dep:typst-layout", "dep:typst-pdf", "dep:sha2"]

[dependencies]
sha2 = { version = "=0.10.9", optional = true }
typst = { version = "=0.15.1", optional = true }
typst-layout = { version = "=0.15.1", optional = true }
typst-pdf = { version = "=0.15.1", optional = true }
