# upper and lower are the deviations in mm (es, ei for shafts, ES, EI for holes); "-" expects
# no value. Covered: every fit of the corpus truth file and of tools/synth FITS, every range bound
# of the common fits (on the bound, and just above it for some), intermediate steps, the grade
# dependent columns, the delta rules and the special cases. The second block holds one class per
# letter and size row of the limit deviation tables of ISO 286-2:2010 (note names the table),
# on the upper bound of the row and for every second row just above the lower bound; each of
# these limits was compared with the printed table. The third block covers the rules above
# 500 mm, the intermediate deviations and the range ends.
# derived_by = "agent": the expected values were computed and compared by the agent, not by the
# owner. The owner sets checked_by_owner = true per vector after comparing it with his
# Tabellenbuch.

