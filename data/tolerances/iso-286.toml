# from micrometres to millimetres. The owner checks every value against his Tabellenbuch; only
# he changes the status. Table numbers in `source` are also to be confirmed by the owner.
# The column conventions of the fundamental deviation parts are described in the README.

[table]
id = "iso-286"
title = "ISO 286-1 limits and fits"
standard = "ISO 286-1"
edition = "2010"
kind = "fit"
unit = "mm"
version = 1
status = "draft"
source = "ISO 286-1:2010, table 1 (standard tolerance grades), tables 2 and 3 (shafts), tables 4 and 5 (holes and delta values)"

