[package]
name = "dimo-io"
description = "Project container, migrations, and imports and exports of inspection data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dimo-core.workspace = true
# Drawing sources for project creation (MF F1, ADR 0010).
dimo-pdf.workspace = true
csv.workspace = true
rust_decimal.workspace = true
rust_xlsxwriter.workspace = true
serde.workspace = true
# float_roundtrip: sheet geometry (f64) must load exactly as saved, or save, load, save differs.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
boon.workspace = true
image.workspace = true
insta.workspace = true
proptest.workspace = true
tiff.workspace = true

[lints]
workspace = true
