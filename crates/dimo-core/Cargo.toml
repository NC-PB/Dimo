[package]
name = "dimo-core"
description = "Domain model of a Dimo project: characteristics, balloons, commands with undo and redo, numbering and validation. Pure logic without IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `specta::Type` on IPC facing types (commands, patches, project). Enabled by the desktop shell.
specta = ["dep:specta", "specta/rust_decimal", "specta/uuid"]

[dependencies]
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
boon.workspace = true
proptest.workspace = true
sha2.workspace = true
specta-serde.workspace = true
specta-typescript.workspace = true

[lints]
workspace = true
