[package]
name = "dimo-desktop"
description = "Tauri shell of the Dimo desktop app: commands, events, protocols and permissions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dimo-core = { workspace = true, features = ["specta"] }
dimo-detect.workspace = true
dimo-export = { workspace = true, features = ["specta"] }
dimo-io.workspace = true
dimo-pdf.workspace = true
dimo-report = { workspace = true, features = ["specta"] }
dimo-tolerance.workspace = true
# Today's date in the time zone of the computer, for the report date (T3.9). Already in the
# lock file through the PDF crates; only the clock feature is added here.
chrono = { workspace = true, features = ["clock"] }
rfd.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Random IDs for new characteristics and balloons (T1.5). Only the shell generates IDs; the
# core gets them through `Environment` (rule 11).
uuid = { workspace = true, features = ["v4"] }

# The only `unsafe` in the project: ShellExecuteW in src/opener/windows.rs (owner decision 2026-10-15).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# MF F2: the CLI export renders byte identical to the app (tests/cli_export.rs).
dimo-cli = { path = "../../../crates/dimo-cli" }
tempfile.workspace = true

[lints]
workspace = true
