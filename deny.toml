# cargo-deny configuration. Enforces NFR-MNT-04: all dependencies license compatible with Apache 2.0.
# Changes to the allow list need a reason in the commit message.

[graph]
all-features = true

[advisories]
# "Unmaintained" notices only, no known vulnerability. All arrive through Tauri 2.11 and have no
# upgrade path on our side. Remove each entry when Tauri drops the crate.
ignore = [
  # proc-macro-error: tauri > muda > gtk 0.18 (Linux GTK3 bindings)
  { id = "RUSTSEC-2024-0370", reason = "via Tauri GTK3 bindings, no fix available" },
  # unic-*: tauri-utils > urlpattern 0.3
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils > urlpattern" },
  # paste: specta 2.0.0-rc.25 (typed IPC, T0.3), build time proc macro only
  { id = "RUSTSEC-2024-0436", reason = "paste via specta, proc macro, no fix available" },
  # Typst (PDF reports, T3.2, owner decision 2026-10-12). Only dimo-report depends on it.
  # quick-xml 0.38: typst-library > hayagriva > citationberg 0.7.0 (latest) parses CSL
  # bibliography XML with it. DimoMark templates never use bibliographies or citations and the data
  # JSON cannot load XML through it (Typst's xml() uses roxmltree), so it is not reachable.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via Typst citationberg, only CSL bibliography XML, never fed by DimoMark" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via Typst citationberg, only CSL bibliography XML, never fed by DimoMark" },
  # Unmaintained notices, transitive through Typst, no fix upstream. Revisit on Typst updates.
  { id = "RUSTSEC-2025-0141", reason = "bincode via Typst syntect, no fix upstream, revisit on Typst updates" },
  # zip 8.6 (dimo-io, rust_xlsxwriter): the three advisories of 2026-10-16 only concern
  # ZipArchive::extract and ZipStreamReader, which unpack a whole archive to disk. DimoMark never
  # calls them: it reads single entries of its own .dimo files and writes ZIP based exports. The
  # fix (zip 9) is younger than 14 days (rule 10) and rust_xlsxwriter 0.99 still needs zip 8.
  # Revisit when both allow zip 9.
  { id = "RUSTSEC-2026-0367", reason = "zip extract() only (SUID bits), DimoMark never extracts archives to disk" },
  { id = "RUSTSEC-2026-0368", reason = "zip extract() only (symlink targets), DimoMark never extracts archives to disk" },
  { id = "RUSTSEC-2026-0369", reason = "zip extract() only (permissions through symlinks), DimoMark never extracts archives to disk" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust via Typst syntect, no fix upstream, revisit on Typst updates" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz via Typst layout and krilla, no fix upstream, revisit on Typst updates" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via Typst and krilla, no fix upstream, revisit on Typst updates" },
  # Not in the spike run of the same day (newer advisory database). serde_yaml backs Typst's
  # yaml() and hayagriva; DimoMark passes data as JSON and its templates load no YAML.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via Typst serde_yaml, no fix upstream, revisit on Typst updates" },
]

[licenses]
# Data inside crates that cargo deny cannot see (T3.23, listed in THIRD_PARTY_LICENSES): typst-assets
# ships HTML and MathML tables under CC-BY-4.0 and the W3C Document License. Accepted by the owner
# 2026-10-17. Its fonts feature (GPL and OFL fonts) stays off; scripts/third-party-licenses.mjs
# fails if it is turned on.
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # File level copyleft. Allowed for unmodified upstream crates pulled in by Tauri (e.g. selectors,
  # cssparser). Using it unmodified is compatible with distributing DimoMark under Apache 2.0.
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no version. Allowed because every crate has publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
