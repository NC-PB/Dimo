# cargo-deny configuration. Enforces NFR-MNT-04: all dependencies license compatible with Apache 2.0.
# Changes to the allow list need a reason in the commit message.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # File level copyleft. Allowed for unmodified upstream crates pulled in by Tauri (e.g. selectors,
  # cssparser). Using it unmodified is compatible with distributing Dimo under Apache 2.0.
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no version. Allowed because every crate has publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
