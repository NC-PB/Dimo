# Pinned prebuilt PDFium binaries (ADR 0005, T0.5).
#
# Source: the pdfium-binaries project, which builds upstream PDFium unmodified for each platform.
# Licenses: PDFium is BSD-3-Clause; the build scripts are MIT; every archive contains the
# licenses of PDFium and its bundled third party code in licenses/ (all permissive). Installers
# must ship that folder.
#
# The release must match the PDFium API level of pdfium-render: feature "pdfium_7881" in the
# workspace Cargo.toml. Change both together. Rules for a bump: release at least 14 days old,
# download every archive, recompute sha256, run ./scripts/check.sh.
#
# Read by scripts/fetch-pdfium.sh and scripts/fetch-pdfium.ps1 with a simple line parser:
# keep one `key = "value"` per line and one [targets.<name>] header per target.

